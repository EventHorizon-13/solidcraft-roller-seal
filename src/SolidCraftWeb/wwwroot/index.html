<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <title>标准辊密封生成</title>
  <link rel="stylesheet" href="/styles.css?v=20261101-theme-hierarchy">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="标准辊密封首页">
    <span>标准辊密封生成</span>
  </a>
</header>
<main class="workspace">
  <section class="work-area">
    <div class="workspace-heading">
      <div class="toolbar">
        <input id="csvFile" type="file" accept=".csv,text/csv" hidden>
        <button id="importBtn" type="button">导入 CSV</button>
        <button id="addBtn" type="button">＋ 新增一行</button>
        <button id="validateBtn" type="button">检查参数</button>
      </div>
      <span id="rowCount">0 行</span>
    </div>
    <section class="table-panel" aria-label="参数表">
      <div class="table-wrap"><table id="grid" aria-label="辊密封参数表"><thead></thead><tbody></tbody></table></div>
      <div class="table-footer"><span>单位 mm</span><span>支持粘贴 Excel / WPS 多格数据</span></div>
    </section>
    <section class="job panel" id="jobPanel">
      <div class="task-status-line" hidden><strong id="jobState">未开始</strong></div>
      <div class="job-body">
        <div class="job-status" id="jobMessage">参数就绪后，选择右侧输出格式。</div>
        <div id="jobStep" class="task-step-caption" role="status"></div>
        <progress id="jobProgress" value="0" max="1" aria-label="生成进度" hidden></progress>
        <div class="actions job-actions" id="jobActions" hidden><button id="cancelBtn" type="button" disabled hidden>取消任务</button><a id="downloadBtn" class="button-link disabled" aria-disabled="true" hidden>下载结果</a></div>
        <details class="log-details" hidden><summary>查看日志</summary><pre id="log" aria-live="polite"></pre></details>
      </div>
    </section>
  </section>
  <aside class="settings panel">

    <section class="quick-output" aria-labelledby="quickHeading">
      <h3 id="quickHeading">快速输出</h3>
      <div class="export-actions"><button id="dxfBtn" type="button">输出 DXF</button><button id="pdfBtn" type="button">输出 PDF</button></div>
    </section>
    <section class="project-output" aria-labelledby="projectHeading">
      <h3 id="projectHeading">项目输出</h3>
      <div class="project-checks">
        <label><input id="exportDxf" type="checkbox">DXF</label>
        <label><input id="exportStep" type="checkbox" checked>STEP</label>
        
        <label><input id="exportPdf" type="checkbox">PDF</label>
        <label><input id="exportCsv" type="checkbox">列表 CSV</label>
      </div>
      <button id="stepBtn" type="button" class="step-button">输出项目 ZIP</button>
    </section>
  </aside>
</main>
<dialog id="accessDialog" class="access-dialog" aria-labelledby="accessTitle">
  <form id="accessForm">
    <div class="access-heading"><h2 id="accessTitle">连接服务</h2><button id="accessClose" type="button" aria-label="关闭访问设置">×</button></div>
    <p>输入 API Key，连接后将在此浏览器自动使用。</p>
    <label for="apiToken">API Key</label>
    <input id="apiToken" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入访问密钥" required>
    <div id="accessError" class="access-error" role="alert" hidden></div>
    <button id="accessSubmit" type="submit">连接并保存</button>
  </form>
</dialog>
<script src="/app.js?v=20261101-web-sync" defer></script>
</body>
</html>
