<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eef2f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141b18" media="(prefers-color-scheme: dark)">
  <title>标准辊密封生成</title>
  <link rel="stylesheet" href="./styles.css?v=20261102-title-versions">
  <link rel="stylesheet" href="./client.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="标准辊密封首页"><span class="brand-title">标准辊密封生成</span>
    <small class="build-versions" aria-label="前后端版本"><span>前端 20261102.1</span><span>后端 无（浏览器计算）</span></small></a>
</header>
<main class="workspace client-workspace">
  <section class="work-area">
    <div class="workspace-heading">
      <div class="toolbar">
        <input id="csvFile" type="file" accept=".csv,text/csv" hidden>
        <button id="importBtn" type="button">导入 CSV</button>
        <button id="addBtn" type="button">＋ 新增一行</button>
        <button id="validateBtn" type="button">检查参数</button>
      </div>
      <span id="rowCount">0 行</span>
    </div>
    <section class="table-panel" aria-label="参数表">
      <div class="table-wrap"><table id="grid" aria-label="辊密封参数表"><thead></thead><tbody></tbody></table></div>
      <div class="table-footer"><span>单位 mm</span><span>参数校验与建模均在当前浏览器完成</span></div>
    </section>
    <section class="job panel" aria-label="生成进度">
      <div class="task-status-line" hidden><strong id="jobState">未开始</strong></div>
      <div class="job-body">
        <div class="job-status" id="jobMessage">请等待 SolidCraft 浏览器引擎加载完成。</div>
        <div id="jobStep" class="task-step-caption" role="status"></div>
        <progress id="jobProgress" value="0" max="1" aria-label="生成进度" hidden></progress>
        <details class="log-details" hidden><summary>查看日志</summary><pre id="log" aria-live="polite"></pre></details>
      </div>
    </section>
  </section>
  <aside class="settings panel">
    <details class="step-options" open>
      <summary>项目输出</summary>
      <div class="check-row"><label><input id="exportCsv" type="checkbox" checked>任务 CSV</label></div>
      <button id="stepBtn" type="button" class="step-button" disabled>生成 STEP / ZIP</button>
    </details>
    <p class="client-limit">实验分支当前提供 STEP、SolidCraft 文件与 CSV。PDF / DXF 的浏览器端生成尚未接入，不会回退到服务器计算。</p>
  </aside>
  <section class="craft-panel panel">
    <div class="section-heading"><h2>SolidCraft 浏览器预览</h2><span class="format-mark">同源 WebAssembly</span></div>
    <iframe id="solidCraftFrame" title="SolidCraft 浏览器内 3D 预览" loading="eager"></iframe>
  </section>
</main>
<script src="./client-app.js?v=20261102-title-versions" defer></script>
</body>
</html>
