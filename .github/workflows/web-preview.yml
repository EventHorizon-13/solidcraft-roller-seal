name: Web Linux server

on:
  workflow_dispatch:
  push:
    branches: [web-linux-ui]
    paths:
      - 'src/SolidCraftWeb/**'
      - 'src/SolidCraftCsvTool/**'
      - 'tools/pdf-export/**'
      - '模板/**'
      - '.github/workflows/web-preview.yml'
      - 'tests/web_resources_smoke.py'
      - 'tests/CoreChecks.csproj'
      - 'tests/*.cs'
      - 'tests/web_ui_check.py'
      - 'tests/PdfPathChecks/**'

concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: linux-x64
            solidcraft_arch: x86_64
            node_arch: x64
          - arch: arm64
            rid: linux-arm64
            solidcraft_arch: aarch64
            node_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Run shared geometry and dimension regression checks
        if: matrix.arch == 'amd64'
        shell: bash
        run: dotnet run --project tests/CoreChecks.csproj -c Release

      - name: Build Web project and check browser code
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/SolidCraftWeb/SolidCraftWeb.csproj -c Release
          if grep -R -nE 'innerHTML|eval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\(' src/SolidCraftWeb/wwwroot; then
            echo "Unsafe dynamic HTML/code execution API found in Web UI."
            exit 1
          fi

      - name: Check PDF subprocess paths
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          PDF_PATH_TEST_NODE="$(command -v node)" dotnet run --project tests/PdfPathChecks/PdfPathChecks.csproj -c Release

      - name: Install open-source PDF renderer
        run: npm install --prefix tools/pdf-export --ignore-scripts --no-audit --no-fund

      - name: Bundle official SolidCraft CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/official dist/app/SolidCraft
          archive="solidcraft-0.28.0-linux-${{ matrix.solidcraft_arch }}.tar.gz"
          curl --fail --location "https://github.com/tangency-labs/solidcraft/releases/download/v0.28.0/$archive" --output "dist/$archive"
          tar -xzf "dist/$archive" -C dist/official
          cli="$(find dist/official -type f -name solidcraft-cli -print -quit)"
          test -n "$cli"
          install -m 755 "$cli" dist/app/SolidCraft/solidcraft-cli
          for notice in LICENSE-MIT LICENSE-APACHE NOTICE THIRD-PARTY-LICENSES.txt; do
            curl --fail --location "https://raw.githubusercontent.com/tangency-labs/solidcraft/v0.28.0/$notice" --output "dist/app/SolidCraft/$notice"
          done

      - name: Bundle Node.js runtime and PDF renderer
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(node --version)"
          archive="node-$node_version-linux-${{ matrix.node_arch }}.tar.xz"
          curl --fail --location "https://nodejs.org/dist/$node_version/$archive" --output "dist/$archive"
          mkdir -p dist/node dist/app/PdfExporter
          tar -xJf "dist/$archive" -C dist/node
          node_dir="$(find dist/node -mindepth 1 -maxdepth 1 -type d -name 'node-*' -print -quit)"
          install -m 755 "$node_dir/bin/node" dist/app/PdfExporter/node
          cp "$node_dir/LICENSE" dist/app/PdfExporter/LICENSE-Node.js
          node tools/pdf-export/build-bundle.mjs dist/app/PdfExporter

      - name: Bundle Source Han Sans SC (SIL OFL)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/app/PdfExporter/fonts
          curl --fail --location --retry 3 https://raw.githubusercontent.com/adobe-fonts/source-han-sans/2.005R/Variable/TTF/SourceHanSansSC-VF.ttf --output dist/SourceHanSansSC-VF.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/adobe-fonts/source-han-sans/2.005R/LICENSE.txt --output dist/app/PdfExporter/fonts/LICENSE-SourceHanSans.txt
          python3 -m venv work/font-tools
          work/font-tools/bin/pip install 'fonttools[woff]==4.60.1'
          work/font-tools/bin/fonttools varLib.instancer dist/SourceHanSansSC-VF.ttf wght=400 --output dist/app/PdfExporter/fonts/SourceHanSansSC-Regular.ttf
          cat src/SolidCraftWeb/wwwroot/index.html src/SolidCraftWeb/wwwroot/app.js src/SolidCraftCsvTool/*.cs > work/ui-font-text.txt
          mkdir -p dist/app/wwwroot/fonts
          work/font-tools/bin/pyftsubset dist/app/PdfExporter/fonts/SourceHanSansSC-Regular.ttf --text-file=work/ui-font-text.txt --unicodes=U+0020-00FF --flavor=woff2 --output-file=dist/app/wwwroot/fonts/SourceHanSansSC-UI.woff2
          cp dist/app/PdfExporter/fonts/LICENSE-SourceHanSans.txt dist/app/wwwroot/fonts/LICENSE.txt

      - name: Publish Web preview
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/SolidCraftWeb/SolidCraftWeb.csproj -c Release -r '${{ matrix.rid }}' \
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -o dist/publish
          cp -R dist/publish/. dist/app/
          cp README.md THIRD_PARTY_NOTICES.md dist/app/
          cp -R docs dist/app/
          cp -R 模板/. dist/app/模板/
          cp tools/pdf-export/fonts.json.example dist/app/模板/字体/fonts.json.example
          cp examples/辊密封参数模板.csv dist/app/辊密封参数模板.csv

      - name: Start Web service smoke test
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          cd dist/app
          ASPNETCORE_URLS=http://127.0.0.1:5080 ./standard-roller-seal-web >web-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5080/api/bootstrap >bootstrap.json; then
              break
            fi
            sleep 1
          done
          grep -q '"columns"' bootstrap.json
          grep -q '"solidCraft":true' bootstrap.json
          curl --fail --silent http://127.0.0.1:5080/ | grep -q '标准辊密封生成'
          cat >job.json <<'JSON'
          {"rows":[["1","5","90","120","105","200","1","1","0","0","0","0","30","30","","","",""]],"combineStep":false,"exportCsv":true,"exportDxf":true,"exportPdf":false}
          JSON
          curl --fail --silent -H 'Content-Type: application/json' --data-binary @job.json http://127.0.0.1:5080/api/jobs >job-created.json
          job_id="$(python3 -c 'import json; print(json.load(open("job-created.json"))["id"])')"
          for i in $(seq 1 180); do
            curl --fail --silent "http://127.0.0.1:5080/api/jobs/$job_id" >job-state.json
            status="$(python3 -c 'import json; print(json.load(open("job-state.json"))["status"])')"
            if [ "$status" = "completed" ]; then break; fi
            if [ "$status" = "failed" ] || [ "$status" = "cancelled" ]; then cat job-state.json; exit 1; fi
            sleep 1
          done
          test "$status" = "completed"
          curl --fail --silent "http://127.0.0.1:5080/api/jobs/$job_id/download" --output result.zip
          unzip -l result.zip | grep -q '\.solidcraft'
          unzip -l result.zip | grep -q '\.dxf'
          unzip -l result.zip | grep -q '\.csv'

      - name: Check resource upload API and selected-frame export
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv work/upload-check-env
          work/upload-check-env/bin/pip install 'ezdxf==1.4.3' 'pypdf==6.1.3' 'playwright==1.56.0'
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          work/upload-check-env/bin/python -m playwright install --with-deps chromium
          cd dist/app
          ROLLERSEAL_WEB_TOKEN=upload-smoke-token ASPNETCORE_URLS=http://127.0.0.1:5080 ./standard-roller-seal-web >resource-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent -H 'X-RollerSeal-Token: upload-smoke-token' http://127.0.0.1:5080/api/bootstrap > /dev/null; then break; fi
            sleep 1
          done
          ../../work/upload-check-env/bin/python ../../tests/web_ui_check.py
          ../../work/upload-check-env/bin/python ../../tests/web_resources_smoke.py

      - name: Save Web UI previews
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: WebUI-previews
          path: |
            work/ui-*.png
            work/export-no-frame.pdf
          retention-days: 7

      - name: Remove smoke-test data from distribution
        shell: bash
        run: |
          rm -rf dist/app/WebData
          rm -f dist/app/*smoke.log dist/app/bootstrap.json dist/app/job*.json dist/app/result.zip

      - name: Package server distribution
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "dist/StandardRollerSeal-web-linux-${{ matrix.arch }}.tar.gz" -C dist/app .

      - uses: actions/upload-artifact@v4
        with:
          name: StandardRollerSeal-web-linux-${{ matrix.arch }}
          path: dist/StandardRollerSeal-web-linux-${{ matrix.arch }}.tar.gz
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && github.event.head_commit.message == 'Release Web server 1.0.0'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: StandardRollerSeal-web-linux-*
          path: dist/release-assets
          merge-multiple: true

      - name: Publish Web server stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(dist/release-assets/StandardRollerSeal-web-linux-*.tar.gz)
          test "${#files[@]}" -eq 2
          repo="EventHorizon-13/solidcraft-roller-seal"
          tag="web-1.0.0"
          title="标准辊密封生成 Web 1.0.0 · 服务器计算正式版"
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace stable assets." >&2
            exit 1
          fi
          cat > dist/release-notes.md <<'EOF'
          标准辊密封生成 Web 1.0.0，服务器计算正式版。
          
          - 提供 Linux amd64、arm64 自包含部署包，内置 SolidCraft CLI、PDF 渲染运行时及开源字体。
          - 建模、STEP、DXF 和 PDF 导出在服务器执行；浏览器只加载轻量网页，无需下载 WebAssembly 计算引擎。
          - 支持 CSV 参数导入、快速 DXF/PDF 下载，以及包含 DXF、STEP、PDF、列表 CSV 的项目 ZIP。
          - 统一浅深色工程界面；手机和宽屏表格按剩余可见高度伸展，标题旁显示前端构建号和后端版本。
          - 密钥弹窗与浏览器记忆、任务实际阶段进度、独立参数检查反馈。
          - 公开部署使用 X-RollerSeal-Token 鉴权；未配置令牌时只允许回环访问。
          - 升级前备份并保留 WebData。解压后运行 standard-roller-seal-web，部署步骤见包内 README。
          
          本次发布针对服务器计算 Web 版；Windows 桌面版沿用 win-* 版本系列。
          
          EOF
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "$title" --notes-file dist/release-notes.md --draft -R "$repo"
          gh release edit "$tag" --draft=false --prerelease=false --latest -R "$repo"
